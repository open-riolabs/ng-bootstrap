name: CI/CD Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  versioning:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0
    outputs:
      GitVersion_SemVer: ${{ env.GitVersion_SemVer }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0 # 0 indica di ottenere tutta la cronologia
      - name: Install GitVersion.Tool
        id: gitversion
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.12.0
          export PATH="$PATH:/github/home/.dotnet/tools"
          dotnet-gitversion /config ./GitVersion.yml /nocache /verbosity Diagnostic /output buildserver
        env:
          GIT_DEPTH: 10000
      - name: Display Version
        run: echo "Version> ${{ env.GitVersion_SemVer }}"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check import hygiene
        run: npm run check:imports
      - name: Test the library
        run: npm run lib:test-ci
      - name: Test the demo app
        run: npm run test-ci

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the library and its schematics
        run: npm run lib:build
      - name: Smoke-test the ng-add schematic
        run: npm run lib:test:ng-add
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      deployments: write
    needs:
      - build
      - versioning
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Set Version and Publish
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org/"
          scope: "@open-rlb"
      - run: |
          cd ./dist/rlb/ng-bootstrap
          npm version ${{ needs.versioning.outputs.GitVersion_SemVer }} --git-tag-version false
          npm publish --allow-same-version --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_OPEN_RLB }}

      - name: Tag repo with new version
        uses: cardinalby/git-tag-action@master
        env:
          TAG: ${{ needs.versioning.outputs.GitVersion_SemVer }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
