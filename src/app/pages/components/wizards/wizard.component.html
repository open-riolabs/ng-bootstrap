<docs-page
  title="Stepper"
  lead="A form split into steps. This page used to hold a recipe — a carousel, some nested FormGroups and forty lines of glue that every project copied and adapted. The recipe was the specification; here it is as a component.">

  <docs-example
    heading="Linear, with a form per step"
    description="Each step names the form it is responsible for. A linear stepper will not move past one that is invalid, and marks its control touched on the way out so the fields say why — refusing silently leaves the user pressing a button that does nothing. Steps already passed get a tick; the one you are on is filled; one you left invalid goes red."
    [code]="basicExample">
    <div [formGroup]="form">
      <rlb-stepper linear (finish)="submit()">
        <rlb-step label="Account" [step-control]="account">
          <div class="row g-3" formGroupName="account">
            <div class="col-12 col-md-6">
              <label class="form-label">Username</label>
              <rlb-input formControlName="username" placeholder="at least 3 characters" enable-validation />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Email</label>
              <rlb-input formControlName="email" type="email" placeholder="you@example.com" enable-validation />
            </div>
          </div>
        </rlb-step>

        <rlb-step label="Profile" [step-control]="profile" hint="Nearly there">
          <div class="row g-3" formGroupName="profile">
            <div class="col-12 col-md-6">
              <label class="form-label">First name</label>
              <rlb-input formControlName="firstName" enable-validation />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">City</label>
              <rlb-input formControlName="city" />
            </div>
          </div>
        </rlb-step>

        <rlb-step label="Confirm" [step-control]="confirm">
          <div formGroupName="confirm">
            <rlb-switch formControlName="agree">
              <label class="form-check-label" after>I accept the terms</label>
            </rlb-switch>
          </div>
        </rlb-step>
      </rlb-stepper>

      @if (stepper(); as s) {
        <div class="d-flex gap-2 justify-content-end mt-4">
          <button rlb-button outline [disabled]="s.isFirst()" (click)="s.previous()">Back</button>
          <button rlb-button (click)="s.next()">{{ s.isLast() ? 'Finish' : 'Next' }}</button>
        </div>
      }

      @if (submitted()) {
        <div class="mt-3 d-flex align-items-center gap-3">
          <span class="text-body-secondary small">Submitted: <code>{{ submitted() | json }}</code></span>
          <button rlb-button size="sm" outline (click)="reset()">Start again</button>
        </div>
      }
    </div>
  </docs-example>

  <docs-example
    heading="Vertical"
    description="The same thing with the strip down the side. Useful when the steps have long names, or when the form is narrow."
    [code]="verticalExample">
    <rlb-stepper orientation="vertical">
      <rlb-step label="One" hint="Pick a plan">
        <p class="mb-0">The first step's content.</p>
      </rlb-step>
      <rlb-step label="Two" optional>
        <p class="mb-0">This one can be skipped.</p>
      </rlb-step>
      <rlb-step label="Three">
        <p class="mb-0">And the last.</p>
      </rlb-step>
    </rlb-stepper>
  </docs-example>

  <docs-api selector="rlb-stepper" [rows]="stepperApi" />
  <docs-api selector="rlb-step" [rows]="stepApi" />
</docs-page>
