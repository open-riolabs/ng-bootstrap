<docs-page
  title="Avatar"
  lead="Display a user profile image with configurable size, shape and custom CSS classes using the rlb-avatar component.">

  <docs-example
    heading="Basic usage"
    description="Provide a src URL to render a circular avatar at the default size of 50 px."
    [code]="basicExample">
    <rlb-avatar src="https://www.w3schools.com/howto/img_avatar.png" />
  </docs-example>

  <docs-example
    heading="Sizes"
    description="Use the size input to control the width and height in pixels. The default is 50."
    [code]="sizeExample">
    <div class="d-flex gap-3 align-items-center">
      <rlb-avatar src="https://www.w3schools.com/howto/img_avatar.png" [size]="30" />
      <rlb-avatar src="https://www.w3schools.com/howto/img_avatar.png" />
      <rlb-avatar src="https://www.w3schools.com/howto/img_avatar.png" [size]="80" />
    </div>
  </docs-example>

  <docs-example
    heading="Shapes"
    description="Choose between circle (fully round, default), round (slight corner radius) and square (no rounding)."
    [code]="shapeExample">
    <div class="d-flex gap-3 align-items-center">
      <rlb-avatar src="https://www.w3schools.com/howto/img_avatar.png" shape="circle" />
      <rlb-avatar src="https://www.w3schools.com/howto/img_avatar.png" shape="round" />
      <rlb-avatar src="https://www.w3schools.com/howto/img_avatar.png" shape="square" />
    </div>
  </docs-example>

  <docs-api selector="rlb-avatar" [rows]="api" />

  <docs-example
    heading="Avatar group"
    description="Who is on this: the avatars overlap, and whoever is left over is counted. The group counts rather than hides — the caller writes the @for and so already decides how many to draw, and a component that silently dropped projected content would be lying about what it was given."
    [code]="groupExample">
    <rlb-avatar-group [extra]="4" [size]="40" ariaLabel="On this ticket">
      <rlb-avatar [src]="photo" [size]="40" />
      <rlb-avatar [src]="photo" [size]="40" />
      <rlb-avatar [src]="photo" [size]="40" />
    </rlb-avatar-group>
  </docs-example>

  <docs-example
    heading="Overlap"
    description="How far each avatar sits over the one before. Tight enough to read as one group, loose enough that each face is still a face."
    [code]="groupOverlapExample">
    <div class="d-flex flex-column gap-3">
      <rlb-avatar-group [overlap]="4" [size]="40" [extra]="2" ariaLabel="Loose">
        <rlb-avatar [src]="photo" [size]="40" />
        <rlb-avatar [src]="photo" [size]="40" />
        <rlb-avatar [src]="photo" [size]="40" />
      </rlb-avatar-group>
      <rlb-avatar-group [overlap]="24" [size]="40" [extra]="2" ariaLabel="Tight">
        <rlb-avatar [src]="photo" [size]="40" />
        <rlb-avatar [src]="photo" [size]="40" />
        <rlb-avatar [src]="photo" [size]="40" />
      </rlb-avatar-group>
    </div>
  </docs-example>

  <docs-example
    heading="Naming the count"
    description="«+12» read on its own tells a screen reader nothing. overflowLabel is a function rather than a string because a number glued to a word is not translatable — Italian here."
    [code]="groupLabelExample">
    <rlb-avatar-group
      [extra]="12"
      [size]="40"
      [overflowLabel]="italianCount"
      ariaLabel="Partecipanti"
    >
      <rlb-avatar [src]="photo" [size]="40" />
      <rlb-avatar [src]="photo" [size]="40" />
    </rlb-avatar-group>
  </docs-example>

  <docs-api selector="rlb-avatar-group" [rows]="groupApi" />
</docs-page>
